name: Taurino Nightly
on:
  schedule:
    - cron: '13 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extended-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Linux native requirements
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config
      - run: uv sync --locked --python ${{ matrix.python }} --all-extras
      - name: Extended tests
        shell: bash
        run: |
          if [ -d tests ] || [ -d python/tests ]; then
            uv run --no-sync --python ${{ matrix.python }} python -m pytest
          else
            echo 'No tests present.'
          fi
