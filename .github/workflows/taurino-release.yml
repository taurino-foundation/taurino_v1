name: Taurino Publish PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing immutable git tag, e.g. v0.1.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: taurino-pypi-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PYTHONUNBUFFERED: "1"
  UV_NO_PROGRESS: "1"

jobs:
  validate:
    name: Validate release tag and metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install validation Python
        run: uv python install 3.11
      - name: Confirm tag and version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git fetch --tags
          uv run --no-project --python 3.11 python .github/scripts/validate_metadata.py
          uv run --no-project --python 3.11 python .github/scripts/validate_version.py --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

  build:
    name: Wheel / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Linux system packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config
      - name: Build Python-specific wheel
        run: uv run --no-project --python ${{ matrix.python-version }} --with 'maturin>=1.14.1,<2.0' maturin build --release --locked --interpreter python --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  sdist:
    name: Build source distribution
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install Python
        run: uv python install 3.11
      - name: Build source distribution
        run: uv run --no-project --python 3.11 --with 'maturin>=1.14.1,<2.0' maturin sdist --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  approve-and-publish:
    name: Approve and publish to PyPI
    needs: [validate, build, sdist]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/taurino/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install validation Python
        run: uv python install 3.11
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Validate distributions
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          uv run --no-project --python 3.11 python .github/scripts/validate_artifacts.py dist --version "$EXPECTED_VERSION"
          uvx --from twine twine check dist/*
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
