name: Taurino Desktop Tests
on:
  workflow_dispatch:
  schedule:
    - cron: '27 2 * * 2'
permissions:
  contents: read
jobs:
  gui-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Linux GUI packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config
      - name: Install dependencies
        run: uv sync --locked --python 3.11 --all-extras
      - name: Linux desktop smoke tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -d tests/gui ]; then
            xvfb-run -a uv run --no-sync python -m pytest tests/gui
          else
            echo 'No tests/gui; add headless GUI smoke tests.'
          fi
      - name: Windows/macOS desktop smoke tests
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [ -d tests/gui ]; then
            uv run --no-sync python -m pytest tests/gui
          else
            echo 'No tests/gui; add desktop smoke tests.'
          fi
