name: Taurino Docs
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - '.github/workflows/taurino-docs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Build MkDocs if configured
        run: |
          if [ -f mkdocs.yml ]; then
            uv run --no-project --with mkdocs mkdocs build --strict
          else
            echo 'No mkdocs.yml: documentation build not configured.'
          fi
